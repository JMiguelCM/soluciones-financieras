# Publica la versión demo (carpeta public/) en GitHub Pages en cada push a main.
# En GitHub Pages no hay servidor: la app detecta *.github.io y usa datos simulados en el navegador.
name: Publicar demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: despliegue
        uses: actions/deploy-pages@v4
