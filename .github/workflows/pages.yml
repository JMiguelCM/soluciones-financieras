# GitHub Pages ya no publica la app (ahora corre en Render con su base en Turso).
# Solo publica un aviso de que la versión de prueba se retiró (carpeta pages/).
name: Publicar aviso en GitHub Pages

on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: despliegue
        uses: actions/deploy-pages@v4
